name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      # Every StatsBomb call is mocked in these layers, so this job needs no
      # network access and runs in well under a minute.
      - name: Run unit and component tests
        run: pytest -m "not e2e" --cov --cov-report=term-missing

  e2e:
    # Only spend time on browser tests once the fast layers are green.
    needs: unit-and-component
    runs-on: ubuntu-latest
    env:
      # Turn "no server running" into a failure instead of a skip, so the
      # job can never go green without a single browser test having run.
      E2E_REQUIRE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Start the app
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          echo "Streamlit did not become healthy within 60 seconds"
          cat streamlit.log
          exit 1

      # The user-journey tests use live StatsBomb open data, so this job
      # also catches upstream data or API changes the mocked layers cannot.
      - name: Run e2e tests
        run: >
          pytest -m e2e
          --screenshot only-on-failure
          --tracing retain-on-failure
          --output test-results

      - name: Upload failure screenshots, traces and app log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            streamlit.log
          retention-days: 7