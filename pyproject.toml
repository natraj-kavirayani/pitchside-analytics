[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchside-analytics"
version = "0.10.0"
description = "Streamlit app for exploring football matches with StatsBomb's free open data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Natraj Kavirayani" }]
requires-python = ">=3.12"
# Keep in step with requirements.txt, which Streamlit Community Cloud
# installs from. The exact versions CI tests with are in requirements.lock.
dependencies = [
    "statsbombpy>=1.14",
    "mplsoccer>=1.3.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    # The app's tabs API and the markup its CSS targets are from 1.64.
    "streamlit>=1.64",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-playwright",
    "hypothesis",
]

[project.urls]
Repository = "https://github.com/natraj-kavirayani/pitchside-analytics"

[tool.setuptools.packages.find]
include = ["pitchside*"]

[tool.pytest.ini_options]
minversion = "8.0"
# Plain `pytest` runs every offline layer: unit, integration, contract
# (sample data only) and component. The layers that need a running server
# or the network run only when asked for: `pytest -m e2e` and
# `pytest -m live` (a later -m overrides this one).
addopts = '-v --tb=short -m "not e2e and not live"'
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast isolated tests of one module, no I/O",
    "integration: MatchService wired to real sources and analytics, offline",
    "contract: data sources checked against the column contract in pitchside.data.schema",
    "live: needs network access to StatsBomb's open data (opt-in)",
    "component: the whole Streamlit page run headlessly via AppTest",
    "e2e: end-to-end browser automation tests using playwright",
]
# Open data needs no credentials; statsbombpy warns about that on every call.
filterwarnings = ["ignore:credentials were not supplied"]

[tool.coverage.run]
source = ["pitchside"]
omit = ["tests/*"]
