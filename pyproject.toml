[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
# Plain `pytest` runs the fast unit and component layers only. The e2e
# layer needs a running Streamlit server and live data, so it runs only
# when asked for with `pytest -m e2e` (a later -m overrides this one).
addopts = '-v --tb=short -m "not e2e"'
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast isolated unit tests for data and plotting modules",
    "component: headless streamlit app state and widget tests",
    "e2e: end-to-end browser automation tests using playwright",
]

[tool.coverage.run]
source = ["data_loader", "visualizations", "styling"]
omit = ["tests/*"]