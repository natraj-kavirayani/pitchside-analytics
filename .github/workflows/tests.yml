name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      # Unit and component tests only: every StatsBomb call is mocked, so
      # this needs no network access. The e2e suite runs in its own job.
      - name: Run tests
        run: pytest -m "not e2e" --cov --cov-report=term-missing

  e2e:
    # Browser tests are slow and use live data, so only run them once the
    # fast layers pass.
    needs: test
    runs-on: ubuntu-latest
    env:
      # A missing server fails the e2e tests instead of skipping them.
      E2E_REQUIRE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Start app
        run: |
          nohup streamlit run app.py --server.headless true --server.port 8501 \
            > streamlit.log 2>&1 &

      - name: Wait for app health check
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8501/_stcore/health > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 1
          done
          echo "App did not become healthy within 60 seconds"
          cat streamlit.log
          exit 1

      - name: Run e2e tests
        run: >
          pytest -m e2e
          --browser chromium
          --screenshot only-on-failure
          --tracing retain-on-failure
          --output test-results

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            streamlit.log
          if-no-files-found: ignore
          retention-days: 14
