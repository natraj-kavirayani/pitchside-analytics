name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a change in StatsBomb's live data shows up even in a quiet week.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      # Every offline layer: unit, integration, contract (sample data) and
      # component. No network access; the e2e and live tests run below.
      - name: Run tests
        run: pytest --cov --cov-report=term-missing

  e2e:
    # Browser tests against the offline sample league: the same data on
    # every run, so a failure here is always about this code.
    needs: test
    runs-on: ubuntu-latest
    env:
      # A missing server fails the e2e tests instead of skipping them.
      E2E_REQUIRE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Start the sample app
        run: |
          PITCHSIDE_DATA_SOURCE=sample nohup streamlit run app.py             --server.headless true --server.port 8502 > streamlit-sample.log 2>&1 &

      - name: Wait for the app's health check
        run: ./.github/wait-for-app.sh 8502 streamlit-sample.log

      - name: Run e2e tests
        run: >
          pytest -m "e2e and not live"
          --browser chromium
          --screenshot only-on-failure
          --tracing retain-on-failure
          --output test-results

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            streamlit-sample.log
          if-no-files-found: ignore
          retention-days: 14

  live:
    # The user journeys and data contract checks on StatsBomb's live open
    # data, fetched from GitHub. They catch upstream changes the sample
    # can't, but can also fail for reasons outside this code (an outage, a
    # rate limit), so a failure here is reported without failing the run.
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      E2E_REQUIRE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Start the app on live data
        run: |
          nohup streamlit run app.py --server.headless true --server.port 8501             > streamlit.log 2>&1 &

      - name: Wait for the app's health check
        run: ./.github/wait-for-app.sh 8501 streamlit.log

      - name: Run live tests
        run: >
          pytest -m live
          --browser chromium
          --screenshot only-on-failure
          --tracing retain-on-failure
          --output test-results

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-failure-artifacts
          path: |
            test-results/
            streamlit.log
          if-no-files-found: ignore
          retention-days: 14
