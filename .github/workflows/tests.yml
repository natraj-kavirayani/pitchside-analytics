name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      # Every offline layer: unit, integration, contract (sample data) and
      # component. No network access; the e2e and live tests run below.
      - name: Run tests
        run: pytest --cov --cov-report=term-missing

  e2e:
    # Browser tests are slow and partly use live data, so only run them
    # once the fast layers pass.
    needs: test
    runs-on: ubuntu-latest
    env:
      # A missing server fails the e2e tests instead of skipping them.
      E2E_REQUIRE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      # Two servers: live StatsBomb data for the user journeys, and the
      # offline sample league so the smoke and motion tests see the same
      # data on every run.
      - name: Start apps
        run: |
          nohup streamlit run app.py --server.headless true --server.port 8501 \
            > streamlit.log 2>&1 &
          PITCHSIDE_DATA_SOURCE=sample nohup streamlit run app.py \
            --server.headless true --server.port 8502 > streamlit-sample.log 2>&1 &

      - name: Wait for app health checks
        run: |
          for port in 8501 8502; do
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:$port/_stcore/health > /dev/null; then
                echo "App on port $port is up"
                continue 2
              fi
              sleep 1
            done
            echo "App on port $port did not become healthy within 60 seconds"
            cat streamlit.log streamlit-sample.log
            exit 1
          done

      # "live" adds the data contract checks against StatsBomb's open data.
      - name: Run e2e and live tests
        run: >
          pytest -m "e2e or live"
          --browser chromium
          --screenshot only-on-failure
          --tracing retain-on-failure
          --output test-results

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            streamlit.log
            streamlit-sample.log
          if-no-files-found: ignore
          retention-days: 14
