name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      # Unit and component tests only: every StatsBomb call is mocked, so
      # this needs no network access. The e2e suite needs a running server
      # and a Playwright browser, so it is excluded here.
      - name: Run tests
        run: pytest -m "not e2e" --cov --cov-report=term-missing
